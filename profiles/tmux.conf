# ============================================
# Pane Navigation — Alt+Arrow (no prefix needed)
# ============================================
# Switch panes without Ctrl+B first
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ============================================
# Zoom / Focus Active Pane
# ============================================
# Ctrl+B then z = toggle zoom (makes active pane fullscreen, press again to restore)
# This is already default, but adding a faster alternative:
bind -n M-z resize-pane -Z

# ============================================
# Pane Resizing — prefix + Arrow (repeatable)
# ============================================
bind -r Left  resize-pane -L 3
bind -r Right resize-pane -R 3
bind -r Up    resize-pane -U 2
bind -r Down  resize-pane -D 2

# ============================================
# Mouse Support (scroll, click to focus, resize)
# ============================================
set -g mouse on

# ============================================
# Better Scrollback
# ============================================
set -g history-limit 50000

# ============================================
# Visual: highlight active pane clearly
# ============================================
# Active pane gets a bright border, inactive gets dim
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=cyan,bold

# Dim inactive panes slightly so active one pops
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=black'

# ============================================
# Status bar — show pane info
# ============================================
set -g status-style bg=colour234,fg=white
set -g status-left '#[fg=cyan,bold] #S '
set -g status-left-length 30
set -g status-right '#{?TNOTE,#[fg=white]#[bg=colour238] #{TNOTE} #[bg=colour234],}#[fg=yellow] #{pane_current_command} #[fg=white]| #[fg=green]%H:%M '
set -g status-right-length 80

# ============================================
# Quality of life
# ============================================
# Faster escape (important for vim/editor usage)
set -sg escape-time 10

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# 256 color support + true color
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc'

# Enable focus events (needed for vim autoread inside tmux)
set -g focus-events on

# Clipboard integration (WSL2)
set -g set-clipboard on

# Anti-artifacting (WSL2 + fast streaming output)
# Aggressive resize — use smallest *active* client, not smallest overall
setw -g aggressive-resize on

# Quick-fix keybinds when artifacts appear:
# prefix + R = refresh display
bind R refresh-client \; display "Refreshed"
# prefix + K = full clear (screen + scrollback)
bind K send-keys -R \; clear-history \; display "Cleared"

# Longer repeat window for repeatable binds (default 500ms)
set -g repeat-time 800

# Intuitive splits (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows keep current path
bind c new-window -c "#{pane_current_path}"

# Vi copy mode — pipe to Windows clipboard via clip.exe
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# Activity monitoring (subtle highlight on background windows)
setw -g monitor-activity on
set -g visual-activity off

# Easy config reload: prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded!"
